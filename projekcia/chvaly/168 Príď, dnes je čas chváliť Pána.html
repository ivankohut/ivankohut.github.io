<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <title>Príď, dnes je čas chváliť Pána</title>
  <link rel="stylesheet" href="song.css">
</head>
<body>

<div id="header">
  <div id="configuration">
    <div>
      <label class="no-print" for="show-accords">Zobraziť priestor pre akordy</label>
      <input id="show-accords" class="no-print" type="checkbox" checked>
      <script>
        document.getElementById('show-accords').addEventListener('change', function () {
          document.documentElement.style.setProperty('--space-for-accords', this.checked ? '3ex' : '0');
        });
      </script>
    </div>
    <script src="fit-to-page.js"></script>
  </div>
  <div id="song-coordinates">
    <h2>č. 168</h2>
    <h3>Príď, dnes je čas chváliť Pána</h3>
    <h4>Chvály</h4>
  </div>
</div>
<table>
  <tr>
    <td class="accordable">
      <div class="slide">
        <p>Príď, dnes je čas chváliť Pána,</p>
        <p>príď, dnes je čas pred Ním</p>
        <p>v úcte stáť.</p>
      </div>
      <div class="slide">
        <p>Tak príď.</p>
      </div>
    </td>
    <td>Sloha 1 <span class="opensong-section-name">V1</span></td>
  </tr>
  <tr>
    <td class="accordable">
      <div class="slide">
        <p>Každý jazyk vyzná raz, Ježiš je Pán,</p>
        <p>každý padne na kolená.</p>
        <p>Požehnanie obdrží ten, ktorý</p>
        <p>Ho dnes už vyznáva.</p>
      </div>
    </td>
    <td>Refrén <span class="opensong-section-name">C</span></td>
  </tr>
</table>

</body>
</html>
