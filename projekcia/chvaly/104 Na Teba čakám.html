<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <title>Na Teba čakám</title>
  <link rel="stylesheet" href="song.css">
</head>
<body>

<div id="header">
  <div id="configuration">
    <div>
      <label class="no-print" for="show-accords">Zobraziť priestor pre akordy</label>
      <input id="show-accords" class="no-print" type="checkbox" checked>
      <script>
        document.getElementById('show-accords').addEventListener('change', function () {
          document.documentElement.style.setProperty('--space-for-accords', this.checked ? '3ex' : '0');
        });
      </script>
    </div>
    <script src="fit-to-page.js"></script>
  </div>
  <div id="song-coordinates">
    <h2>č. 104</h2>
    <h3>Na Teba čakám</h3>
    <h4>Chvály</h4>
  </div>
</div>
<table>
  <tr>
    <td class="accordable">
      <div class="slide">
        <p>Na Teba čakám,</p>
        <p>bývaj vo mne sám.</p>
        <p>Po Tebe žíznim,</p>
        <p>môj Pán.</p>
      </div>
      <div class="slide">
        <p>Ukry ma v láske,</p>
        <p>v bázni uč ma stáť.</p>
        <p>Poznať Ťa túžim</p>
        <p>viac a viac.</p>
      </div>
    </td>
    <td>Sloha 1 <span class="opensong-section-name">V1</span></td>
  </tr>
  <tr>
    <td class="accordable">
      <div class="slide">
        <p>Ži vo mne sám,</p>
        <p>život môj si vezmi.</p>
        <p>Vdýchni svoj dych,</p>
        <p>nech na krídlach</p>
        <p>sa môžem vzniesť.</p>
      </div>
    </td>
    <td>Refrén <span class="opensong-section-name">C</span></td>
  </tr>
</table>

</body>
</html>
