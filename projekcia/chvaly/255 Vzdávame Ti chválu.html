<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <title>Vzdávame Ti chválu</title>
  <link rel="stylesheet" href="song.css">
</head>
<body>

<div id="header">
  <div id="configuration">
    <div>
      <label class="no-print" for="show-accords">Zobraziť priestor pre akordy</label>
      <input id="show-accords" class="no-print" type="checkbox" checked>
      <script>
        document.getElementById('show-accords').addEventListener('change', function () {
          document.documentElement.style.setProperty('--space-for-accords', this.checked ? '3ex' : '0');
        });
      </script>
    </div>
    <script src="fit-to-page.js"></script>
  </div>
  <div id="song-coordinates">
    <h2>č. 255</h2>
    <h3>Vzdávame Ti chválu</h3>
    <h4>Chvály</h4>
  </div>
</div>
<table>
  <tr>
    <td class="accordable">
      <div class="slide">
        <p>Vzdávame Ti chválu,</p>
        <p>česť a slávu,</p>
        <p>my dvíhame svoje ruky,</p>
        <p>vyvyšujeme Ťa.</p>
      </div>
    </td>
    <td>Sloha 1 <span class="opensong-section-name">V1</span></td>
  </tr>
  <tr>
    <td>
      <div class="slide">
        <p>Veď Ty si Boh,</p>
        <p>činíš veľké divy,</p>
        <p>Boh, nie je nikto,</p>
        <p>ako Ty.</p>
      </div>
    </td>
    <td>Sloha 2 <span class="opensong-section-name">V2</span></td>
  </tr>
</table>

</body>
</html>
