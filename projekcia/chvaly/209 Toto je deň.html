<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <title>Toto je deň</title>
  <link rel="stylesheet" href="song.css">
</head>
<body>

<div id="header">
  <div id="configuration">
    <div>
      <label class="no-print" for="show-accords">Zobraziť priestor pre akordy</label>
      <input id="show-accords" class="no-print" type="checkbox" checked>
      <script>
        document.getElementById('show-accords').addEventListener('change', function () {
          document.documentElement.style.setProperty('--space-for-accords', this.checked ? '3ex' : '0');
        });
      </script>
    </div>
    <script src="fit-to-page.js"></script>
  </div>
  <div id="song-coordinates">
    <h2>č. 209</h2>
    <h3>Toto je deň</h3>
    <h4>Chvály</h4>
  </div>
</div>
<table>
  <tr>
    <td class="accordable">
      <div class="slide">
        <p>/: Toto je deň,</p>
        <p>ktorý dal nám Pán,</p>
        <p>radujme sa,</p>
        <p>zaznej pieseň chvál. :/</p>
      </div>
    </td>
    <td>Sloha 1 <span class="opensong-section-name">V1</span></td>
  </tr>
  <tr>
    <td class="accordable">
      <div class="slide">
        <p>Jasaj v Pánovi.</p>
      </div>
    </td>
    <td>Refrén <span class="opensong-section-name">C</span></td>
  </tr>
  <tr>
    <td>
      <div class="slide">
        <p>/: Chváľme Pána,</p>
        <p>On je prítomný,</p>
        <p>On je našich</p>
        <p>chvál hodný. :/</p>
      </div>
    </td>
    <td>Sloha 2 <span class="opensong-section-name">V2</span></td>
  </tr>
</table>

</body>
</html>
