<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <title>Ľúbime Teba</title>
  <link rel="stylesheet" href="song.css">
</head>
<body>

<div id="header">
  <div id="configuration">
    <div>
      <label class="no-print" for="show-accords">Zobraziť priestor pre akordy</label>
      <input id="show-accords" class="no-print" type="checkbox" checked>
      <script>
        document.getElementById('show-accords').addEventListener('change', function () {
          document.documentElement.style.setProperty('--space-for-accords', this.checked ? '3ex' : '0');
        });
      </script>
    </div>
    <script src="fit-to-page.js"></script>
  </div>
  <div id="song-coordinates">
    <h2>č. 92</h2>
    <h3>Ľúbime Teba</h3>
    <h4>Chvály</h4>
  </div>
</div>
<table>
  <tr>
    <td class="accordable">
      <div class="slide">
        <p>Ľúbime Teba,</p>
        <p>drahý Otče,</p>
        <p>Ty v rukách držíš</p>
        <p>celú Zem.</p>
      </div>
      <div class="slide">
        <p>Naše ústa prehlasujú</p>
        <p>Tvoju vládu.</p>
        <p>Tvoj ľud pozná,</p>
        <p>aký úžasný si Pán.</p>
      </div>
    </td>
    <td>Sloha 1 <span class="opensong-section-name">V1</span></td>
  </tr>
  <tr>
    <td class="accordable">
      <div class="slide">
        <p>Požehnaný Pán Boh</p>
        <p>náš slávny.</p>
        <p>Čo bol a je</p>
        <p>a ktorý príde.</p>
      </div>
      <div class="slide">
        <p>Požehnaný Pán Boh</p>
        <p>náš slávny,</p>
        <p>čo večnú vládu má.</p>
      </div>
    </td>
    <td>Refrén <span class="opensong-section-name">C</span></td>
  </tr>
</table>

</body>
</html>
