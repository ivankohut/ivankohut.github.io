<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <title>Ješua</title>
  <link rel="stylesheet" href="song.css">
</head>
<body>

<div id="header">
  <div id="configuration">
    <div>
      <label class="no-print" for="show-accords">Zobraziť priestor pre akordy</label>
      <input id="show-accords" class="no-print" type="checkbox" checked>
      <script>
        document.getElementById('show-accords').addEventListener('change', function () {
          document.documentElement.style.setProperty('--space-for-accords', this.checked ? '3ex' : '0');
        });
      </script>
    </div>
    <script src="fit-to-page.js"></script>
  </div>
  <div id="song-coordinates">
    <h2>č. 368</h2>
    <h3>Ješua</h3>
    <h4>Chvály</h4>
  </div>
</div>
<table>
  <tr>
    <td class="accordable">
      <div class="slide">
        <p>Môjho srdca Kráľ</p>
        <p>krásou vyniká</p>
        <p>nad tisíc, nad tisíc.</p>
      </div>
    </td>
    <td>Sloha 1 <span class="opensong-section-name">V1</span></td>
  </tr>
  <tr>
    <td class="accordable">
      <div class="slide">
        <p>Ješua.</p>
      </div>
    </td>
    <td>Refrén <span class="opensong-section-name">C</span></td>
  </tr>
  <tr>
    <td class="accordable">
      <div class="slide">
        <p>Len Tvoje je kráľovstvo,</p>
        <p>Tvoja je všetka moc,</p>
        <p>Tvoja je sláva na veky.</p>
        <p>Amen.</p>
      </div>
    </td>
    <td>Prechod <span class="opensong-section-name">B</span></td>
  </tr>
</table>

</body>
</html>
