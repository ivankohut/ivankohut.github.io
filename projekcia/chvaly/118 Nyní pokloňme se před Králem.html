<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <title>Nyní pokloňme se před Králem</title>
  <link rel="stylesheet" href="song.css">
</head>
<body>

<div id="header">
  <div id="configuration">
    <div>
      <label class="no-print" for="show-accords">Zobraziť priestor pre akordy</label>
      <input id="show-accords" class="no-print" type="checkbox" checked>
      <script>
        document.getElementById('show-accords').addEventListener('change', function () {
          document.documentElement.style.setProperty('--space-for-accords', this.checked ? '3ex' : '0');
        });
      </script>
    </div>
    <script src="fit-to-page.js"></script>
  </div>
  <div id="song-coordinates">
    <h2>č. 118</h2>
    <h3>Nyní pokloňme se před Králem</h3>
    <h4>Chvály</h4>
  </div>
</div>
<table>
  <tr>
    <td class="accordable">
      <div class="slide">
        <p>Nyní pokloňme se</p>
        <p>před Králem,</p>
        <p>klekněme před</p>
        <p>našim Stvořitelem.</p>
      </div>
      <div class="slide">
        <p>Vždyť On je náš Bůh</p>
        <p>a my sme ovce pastvin Jeho.</p>
        <p>Stádem, jenž On sám vodí,</p>
        <p>rukou svou Bůh nás vodí.</p>
      </div>
    </td>
    <td>Sloha 1 <span class="opensong-section-name">V1</span></td>
  </tr>
</table>

</body>
</html>
