<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <title>Ja chválu Ti vzdám</title>
  <link rel="stylesheet" href="song.css">
</head>
<body>

<div id="header">
  <div id="configuration">
    <div>
      <label class="no-print" for="show-accords">Zobraziť priestor pre akordy</label>
      <input id="show-accords" class="no-print" type="checkbox" checked>
      <script>
        document.getElementById('show-accords').addEventListener('change', function () {
          document.documentElement.style.setProperty('--space-for-accords', this.checked ? '3ex' : '0');
        });
      </script>
    </div>
    <script src="fit-to-page.js"></script>
  </div>
  <div id="song-coordinates">
    <h2>č. 59</h2>
    <h3>Ja chválu Ti vzdám</h3>
    <h4>Chvály</h4>
  </div>
</div>
<table>
  <tr>
    <td class="accordable">
      <div class="slide">
        <p>Ja chválu Ti vzdám</p>
        <p>a spievam Ti rád,</p>
        <p>ja spievam Ti rád,</p>
        <p>ó, môj Ježiš.</p>
      </div>
    </td>
    <td>Sloha 1 <span class="opensong-section-name">V1</span></td>
  </tr>
  <tr>
    <td>
      <div class="slide">
        <p>Ja chválu Ti vzdám</p>
        <p>a ruky dvíham,</p>
        <p>ja ruky dvíham</p>
        <p>k Tebe len.</p>
      </div>
    </td>
    <td>Sloha 2 <span class="opensong-section-name">V2</span></td>
  </tr>
  <tr>
    <td>
      <div class="slide">
        <p>Spievam: milujem Ťa,</p>
        <p>spievam: milujem Ťa,</p>
        <p>spievam: milujem,</p>
        <p>Teba milujem.</p>
      </div>
    </td>
    <td>Sloha 3 <span class="opensong-section-name">V3</span></td>
  </tr>
</table>

</body>
</html>
